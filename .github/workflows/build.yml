name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # 提前创建 release，避免多个矩阵任务并发抢建同一个 release 而报 already_exists
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" \
                 --repo "${{ github.repository }}" \
                 --title "营销通 ${{ github.ref_name }}" \
                 --notes "自动构建：营销通 ${{ github.ref_name }}"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon（原生 arm64 机器）
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"
            apple_signing_identity: "-"
            run_tests: false
          # macOS Intel（在 arm64 机器上交叉编译）
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg"
            apple_signing_identity: "-"
            run_tests: false
          # Windows x64。暂不出 arm64：Obscura 侧车无 arm64 Windows 产物，
          # 且用户明确表示本批次暂不需要 Windows arm64。
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
            apple_signing_identity: ""
            run_tests: false
          # Linux x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu --bundles appimage"
            apple_signing_identity: ""
            run_tests: true
          # Linux arm64（原生 arm64 机器）
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: "--target aarch64-unknown-linux-gnu --bundles appimage"
            apple_signing_identity: ""
            run_tests: false

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      # 交叉编译时按目标三元组取对应引擎，而不是按宿主架构
      - name: Download Obscura sidecar
        shell: bash
        env:
          OBSCURA_TARGET: ${{ matrix.target }}
        run: ./scripts/download-obscura.sh

      - name: Install Linux system dependencies
        # 覆盖 x64 与 arm64 两种 ubuntu runner
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run unit tests (Linux)
        if: matrix.run_tests
        run: |
          # 全量跑 lib 单测。**不要**改回逐个模块点名——点名的写法会让新增的
          # 测试模块静默不执行（引擎解析链与平台能力矩阵就曾因此从未在 CI 跑过）。
          #
          # 跳过 test_encrypt_decrypt_roundtrip：它依赖系统钥匙串，在无交互的 CI
          # 环境里会阻塞等待授权。测试只在 ubuntu-22.04 上跑，因此
          # obscura::engine 里按平台分支的候选路径断言会在这里真正被验证。
          cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --lib \
            -- --skip test_encrypt_decrypt_roundtrip

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS ad-hoc 签名："-" 表示无证书临时签名（仅 macOS 打包读取该变量）
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "营销通 ${{ github.ref_name }}"
          releaseDraft: false

      # 验证 dmg 内的 app 确实带 ad-hoc 签名（未签名则 codesign 报错，步骤失败）
      # 注意：tauri 打完 dmg 后会 Cleaning 掉中间 .app，只能从 dmg 内验证
      - name: Verify ad-hoc signature (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          DMG=$(ls "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            echo "::error::找不到 dmg（${{ matrix.target }}/release/bundle/dmg/*.dmg）"
            exit 1
          fi
          echo "=== dmg: $DMG ==="
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -quiet
          # app 名为 productName（现为中文「营销通」），用 glob 避免写死
          APP=$(ls -d "$MOUNT"/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::dmg 内找不到 .app"
            hdiutil detach "$MOUNT" -quiet || true
            exit 1
          fi
          echo "=== app 名称: $(basename "$APP") ==="
          # 架构必须与目标一致，避免交叉编译产出错架构的包
          echo "=== 可执行文件架构 ==="
          lipo -archs "$APP/Contents/MacOS/marketingconnect"
          BIN_ARCHS=$(lipo -archs "$APP/Contents/MacOS/marketingconnect")
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) EXPECT="arm64" ;;
            x86_64-apple-darwin)  EXPECT="x86_64" ;;
            *) EXPECT="" ;;
          esac
          if [ -n "$EXPECT" ] && [ "$BIN_ARCHS" != "$EXPECT" ]; then
            echo "::error::架构不符合预期：实际 $BIN_ARCHS，期望 $EXPECT"
            hdiutil detach "$MOUNT" -quiet || true
            exit 1
          fi
          echo "=== 签名信息 ==="
          codesign -dvv "$APP" 2>&1 || true
          echo "=== 签名校验 ==="
          codesign --verify --verbose=2 "$APP"
          hdiutil detach "$MOUNT" -quiet

  # 三平台安装包全部就绪后，汇总生成 checksum-sha1 / checksum-md5 上传到 release
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets && cd assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*" --dir . --clobber

      # GitHub Releases 会剥离资源名里的非 ASCII 字符：
      # 本地产物名为「营销通_1.0.x_arch.ext」，上传后变成「_1.0.x_arch.ext」。
      # 这里补回 ASCII 前缀，得到规范的 MarketingConnect_1.0.x_arch.ext。
      # （安装后的软件名不受影响，仍是中文「营销通」）
      - name: Normalize release asset names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd assets
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          shopt -s nullglob
          for f in _*.dmg _*.exe _*.AppImage; do
            new="MarketingConnect${f}"
            echo "重命名: $f -> $new"
            mv "$f" "$new"
            gh release upload "$TAG" "$new" --repo "$REPO" --clobber
            gh release delete-asset "$TAG" "$f" --repo "$REPO" --yes
          done
          echo "=== 规范化后的资产 ==="
          ls -1

      # 每个平台都必须有各自架构的产物，缺一即失败
      - name: Verify all architecture artifacts exist
        shell: bash
        run: |
          cd assets
          missing=0
          for pattern in \
            "*aarch64.dmg" "*x64.dmg" \
            "*x64-setup.exe" \
            "*amd64.AppImage" "*aarch64.AppImage"
          do
            if ! ls $pattern >/dev/null 2>&1; then
              echo "::error::缺少产物: $pattern"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "现有资产："; ls -1
            exit 1
          fi
          echo "=== 架构覆盖检查通过 ==="

      - name: Generate checksum-sha1 / checksum-md5
        shell: bash
        run: |
          cd assets
          # 清除历史 checksum 文件，只对安装包计算
          rm -f checksums-sha1.txt checksums-md5.txt
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in checksums-*.txt) continue ;; esac
            sha1sum "$f" >> checksums-sha1.txt
            md5sum "$f" >> checksums-md5.txt
          done
          echo "=== checksums-sha1.txt ==="
          cat checksums-sha1.txt
          echo "=== checksums-md5.txt ==="
          cat checksums-md5.txt
          if [ ! -s checksums-sha1.txt ] || [ ! -s checksums-md5.txt ]; then
            echo "::error::checksum 文件为空，release 中没有安装包"
            exit 1
          fi

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd assets
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            checksums-sha1.txt checksums-md5.txt --clobber