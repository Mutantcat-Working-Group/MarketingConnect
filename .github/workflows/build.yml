name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：仅 dmg，ad-hoc 签名（无开发者证书）
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
            apple_signing_identity: "-"
          # Windows：仅 NSIS（.exe 安装包）
          - platform: windows-latest
            args: "--bundles nsis"
            apple_signing_identity: ""
          # Linux：仅 AppImage
          - platform: ubuntu-22.04
            args: "--bundles appimage"
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Download Obscura sidecar
        shell: bash
        run: ./scripts/download-obscura.sh

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS ad-hoc 签名："-" 表示无证书临时签名（仅 macOS 打包读取该变量）
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "营销通 ${{ github.ref_name }}"
          releaseDraft: false

      # 验证 dmg 内的 app 确实带 ad-hoc 签名（未签名则 codesign 报错，步骤失败）
      # 注意：tauri 打完 dmg 后会 Cleaning 掉中间 .app，只能从 dmg 内验证
      - name: Verify ad-hoc signature (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          DMG=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            echo "::error::找不到 dmg（bundle/dmg/*.dmg）"
            exit 1
          fi
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -quiet
          APP="$MOUNT/MarketingConnect.app"
          echo "=== 签名信息 ==="
          codesign -dvv "$APP" 2>&1 || true
          echo "=== 签名校验 ==="
          codesign --verify --verbose=2 "$APP"
          hdiutil detach "$MOUNT" -quiet

  # 三平台安装包全部就绪后，汇总生成 checksum-sha1 / checksum-md5 上传到 release
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets && cd assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*" --dir . --clobber

      - name: Generate checksum-sha1 / checksum-md5
        shell: bash
        run: |
          cd assets
          # 清除历史 checksum 文件，只对安装包计算
          rm -f checksums-sha1.txt checksums-md5.txt
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in checksums-*.txt) continue ;; esac
            sha1sum "$f" >> checksums-sha1.txt
            md5sum "$f" >> checksums-md5.txt
          done
          echo "=== checksums-sha1.txt ==="
          cat checksums-sha1.txt
          echo "=== checksums-md5.txt ==="
          cat checksums-md5.txt
          if [ ! -s checksums-sha1.txt ] || [ ! -s checksums-md5.txt ]; then
            echo "::error::checksum 文件为空，release 中没有安装包"
            exit 1
          fi

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd assets
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            checksums-sha1.txt checksums-md5.txt --clobber
